services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartdesk-postgres
    restart: unless-stopped
    networks:
      - smartdesk-net
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartdesk-backend
    restart: unless-stopped
    networks:
      - smartdesk-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/smartdesk
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # No value is committed. Empty = random per-process secret (demo login on) or refuse to start (demo login off).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      LLM_TIMEOUT_SECONDS: 4.0
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      TRUSTED_PROXY_CIDRS: "127.0.0.1/32,::1/128,172.28.0.0/16"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartdesk-frontend
    restart: unless-stopped
    networks:
      - smartdesk-net
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

networks:
  smartdesk-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
